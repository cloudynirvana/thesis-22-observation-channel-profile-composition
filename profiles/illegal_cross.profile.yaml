schema_version: 1.2.0-compose
profile_id: dp-compose-illegal-cross-001
extends:
  object: DiseaseProfile
  schema_version: 1.0.0
  source: 'Thesis #3 Disease Profile contract, local composition extension 1.2.0-compose.
    Does not edit schema 1.1.0-multiobs.'
disease_id: named-channel-class-unspecified
disease_label: Unspecified class used to test composition of named maps. Not a patient
  and not a stage.
created_at: '2026-09-21T00:00:00Z'
asker_role: methods_researcher
answers:
- id: Q1
  question: Who is asking?
  label: A methods researcher asking when named observation channels may be joined.
- id: Q2
  question: Which disease, not a generic slogan?
  label: An unspecified class of named observation channels. No person and no stage.
- id: Q3
  question: What is the current regime?
  label: An in-silico join of declared maps. No clinical regime is asserted.
- id: Q4
  question: Where is the system stuck?
  label: The portfolio has a profile object, one named channel, and one multi-channel
    file. It does not yet say which joins preserve that file as a profile.
observables:
- id: obs-map-not-parameter
  statement: A named observation channel is a map. Its coefficient is not a member
    of a therapeutic parameter list unless a separate identification argument says
    so.
  citation_ids:
  - cit-bellman-1970
  - cit-t08
- id: obs-profile-object
  statement: A Disease Profile is a versioned research export. It is not a chart and
    not a parameter table.
  citation_ids:
  - cit-t03
  - cit-wilkinson-2016
- id: obs-fusion-is-not-join
  statement: Pooling readings under one symbol answers a different question from keeping
    the readings as separate maps.
  citation_ids:
  - cit-bareinboim-2016
  - cit-bloch-1996
  - cit-t15
observation_channels:
- channel_id: ch_spectral
  name: Spectral-contrast map
  symbol: y_S
  map_coefficient: beta
  observes: A declared spectral contrast. Not a copy of a published reporter loading.
  parameter_status: not_in_theta
  factor_id: f_spectral
  source_prior: T15
  refusal: The spectral coefficient is not a killing coefficient and is not renamed
    when a second channel is attached.
- channel_id: ch_compartment
  name: Compartment-indicator map
  symbol: y_C
  map_coefficient: gamma
  observes: A declared compartment indicator. Not a vesicle count and not a delivery
    rate.
  parameter_status: not_in_theta
  factor_id: f_compartment
  source_prior: T15
  refusal: The compartment coefficient stays a map coefficient. Tropism language does
    not become a rate inside theta.
composition:
  operator: disjoint_union
  quotient: null
  combiner: null
  factors:
  - factor_id: f_spectral
    source_prior: T15
    disease_id: named-channel-class-unspecified
    channel_ids:
    - ch_spectral
  - factor_id: f_compartment
    source_prior: T15
    disease_id: other-channel-class
    channel_ids:
    - ch_compartment
candidate_mechanisms:
- id: M-DISJOINT
  statement: The composed object keeps one symbol and one map coefficient for each
    named channel.
  evidence_class: definition
  falsifier: A preparation series whose loadings differ, fitted anyway by one shared
    coefficient.
  status: admitted
- id: M-ONE-THETA
  statement: One therapeutic parameter accounts for every channel in the join.
  evidence_class: knowledge
  falsifier: ''
  status: refused
  refusal_rule: composition_quotient
non_parameters:
- id: merged_therapeutic_theta
  statement: One symbol used as every channel's map coefficient and entered as a therapeutic
    parameter.
- id: composition_quotient
  statement: A join that identifies distinct map coefficients.
- id: product_of_map_coefficients
  statement: A product of two map coefficients written as one parameter.
- id: arithmetic_mean_of_channels
  statement: An arithmetic mean of channel readouts written as one parameter.
- id: channel_promoted_into_theta
  statement: A single named channel whose status is changed to in_theta by the act
    of joining.
- id: self_composition
  statement: A channel joined to a second copy of the same channel identifier.
- id: assay_scalar_as_treatment
  statement: An assay-shaped map coefficient copied in as a treatment parameter. No
    assay table is stored here.
theta: []
admitted_hypotheses:
- id: H-JOIN-001
  statement: A disjoint union of named maps is a Disease Profile only while each map
    coefficient stays out of theta and the composition record names no quotient.
  falsifier: Any composed file with a non-empty theta list, a quotient, a combiner,
    a repeated channel identifier, or two disease-class identifiers.
  parameter_status: forbidden_to_enter_theta
